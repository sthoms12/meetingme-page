<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/b4wemeet-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const url = new URL(window.location.href);
        if (!/^\/[^/]+\/edit$/.test(url.pathname)) return;
        const hashParams = new URLSearchParams(url.hash.replace(/^#/, ''));
        const token = hashParams.get('token') || url.searchParams.get('token');
        if (!token) return;
        window.__b4wemeetEditToken = token;
        url.searchParams.delete('token');
        hashParams.delete('token');
        url.hash = hashParams.toString();
        window.history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
      })();
    </script>
    <script defer src="/zowa.js"></script>
    <title>B4WeMeet | Pre-meeting intro pages for better meetings</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
        window.addEventListener('error', (event) => {
          const isOurAppError = event.filename && event.filename.startsWith(window.location.origin);
          if (isOurAppError) {
            navigator.sendBeacon('/api/client-errors', JSON.stringify({
              message: event.message,
              url: window.location.href,
              userAgent: navigator.userAgent,
              source: event.filename,
              lineno: event.lineno,
              colno: event.colno,
              stack: event.error ? event.error.stack : null,
              timestamp: new Date().toISOString()
            }));
          }
        }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
